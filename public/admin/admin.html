<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Cactea · Panel</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- LOGIN -->
  <section id="vista-login" class="login">
    <form id="form-login" class="tarjeta">
      <h1>Cactea</h1>
      <p>Panel de administrador</p>
      <input id="usuario" placeholder="Usuario" autocomplete="username" required>
      <input id="clave" type="password" placeholder="Contraseña" autocomplete="current-password" required>
      <button class="btn" type="submit">Entrar</button>
      <p id="login-error" class="error"></p>
    </form>
  </section>

  <!-- PANEL -->
  <section id="vista-panel" hidden>
    <header class="barra">
      <h1>Cactea · Panel</h1>
      <nav>
        <button class="tab activa" data-tab="mensajes">Mensajes</button>
        <button class="tab" data-tab="productos">Productos</button>
      </nav>
      <button id="btn-salir" class="btn-sec">Salir</button>
    </header>

    <main>
      <div id="tab-mensajes">
        <p id="msj-vacio" class="vacio" hidden>Aún no hay mensajes 🌱</p>
        <div id="lista-mensajes"></div>
      </div>

      <div id="tab-productos" hidden>
        <form id="form-producto" class="tarjeta">
          <h2 id="titulo-form">Nuevo producto</h2>
          <input type="hidden" id="p-id">
          <input id="p-nombre" placeholder="Nombre" required>
          <select id="p-categoria">
            <option value="suculentas">Suculentas</option>
            <option value="cactus">Cactus</option>
          </select>
          <input id="p-precio" type="number" step="0.01" min="0" placeholder="Precio" required>
          <input id="p-imagen" placeholder="Imagen (ej: img/producto-1.jpg)">
          <textarea id="p-descripcion" rows="3" placeholder="Descripción"></textarea>
          <label class="check"><input id="p-destacado" type="checkbox"> Destacado</label>
          <div class="fila">
            <button class="btn" type="submit">Guardar</button>
            <button id="btn-cancelar" class="btn-sec" type="button" hidden>Cancelar edición</button>
          </div>
        </form>
        <div id="lista-productos"></div>
      </div>

      <p id="aviso" class="aviso" hidden></p>
    </main>
  </section>

  <script src="admin.js"></script>
</body>
</html>
